substitutions:
  default_log_level: WARN
  max_log_level: DEBUG
  debug_toggle_switch_active_time_max: "24h"
  uart_logger_baud_rate: "0" # Disable UART, required for TuyaMCU communication
  default_syslog_server_ip: "192.168.0.15"
  default_syslog_server_port: 514
  syslog_log_level: DEBUG
  ntp_timezone: "America/Toronto"
  ntp_server_1: "192.168.0.3"
  ntp_server_2: "192.168.0.250"
  ntp_server_3: "0.pool.ntp.org"
  api_reboot_timeout: 0s # Disable API reboot to prevent dimmer from turning off on reboots
  indicator_brightness_when_offline_percent: 100
  multiclick_min_length: "40ms" # Should be above 30ms
  multiclick_max_length: "350ms"
  longpress_min_length: "1000ms"
  longpress_reboot_timeout: "10s"
  default_relay_on_boot_is_active: "false" 

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  on_boot: 
    then:
      - light.control:
          id: led_light
          brightness: !lambda return id(indicator_brightness).state / 100;
      - if:
          condition:
            lambda: return id(relay_on_boot_state) == true;
          then:
            - delay: 1s
            - switch.turn_on: output_relay
          else:
            - switch.turn_off: output_relay 

bk72xx:
  board: cb2s

packages:
  remote_package_files:
    url: https://github.com/bennydiamond/common_esphome_template/
    files: [arduino.common.yaml]  # optional; if not specified, all files will be included
    ref: master  # optional
    refresh: 1h  # optional     

globals:
  - id: relay_local_control_active
    type: bool
    restore_value: Yes
    initial_value: "true"
  - id: relay_local_control_fallback_active
    type: bool
    restore_value: Yes
    initial_value: "true"
  - id: relay_on_boot_state
    type: bool
    restore_value: Yes
    initial_value: ${default_relay_on_boot_is_active}

# Enable Home Assistant API
api:
  id: id_esphome_api
  reboot_timeout: ${api_reboot_timeout}
  # If device disconnected from API for 10 minutes, turn off the indicator LEDs.
  on_client_disconnected:
    if:
      condition:
        for:
          time: 10min
          condition:
            not:
              api.connected:
      then:
        - number.set:
            id: indicator_brightness
            value: ${indicator_brightness_when_offline_percent}

captive_portal:
  id: id_captive_portal

web_server:
  id: id_web_server
  include_internal: True

debug:
  id: id_debug
  update_interval: 30s
  
binary_sensor:
  - platform: gpio
    name: "Button Up"
    id: button_up
    pin: 
      number: P6
      mode:
        input: True
        pullup: True
      inverted: True
    filters:
      delayed_on_off: 30ms
    internal: True
    on_multi_click: 
      - timing: 
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for at least ${multiclick_max_length}
        then:
          - if:
              condition:
                or:
                  # If local control is enabled
                  - lambda: return id(relay_local_control_active) == true;
                  # Or if fallback control is enabled and API or WIFI are not connected
                  - and:
                      - lambda: return id(relay_local_control_fallback_active) == true;
                      - or:
                          - not:
                              - api.connected:
                          - not:
                              - wifi.connected:
              then:
                - switch.turn_on: output_relay
          - homeassistant.event:
              event: esphome.button_pressed
              data:
                message: up_singleclick
      - timing:
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for ${multiclick_min_length} to ${multiclick_max_length}
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for at least ${multiclick_max_length}
        then:
          - homeassistant.event:
              event: esphome.button_pressed
              data:
                message: up_doubleclick
      - timing: 
          - ON for at least ${longpress_min_length}
        then:
          - homeassistant.event:
              event: esphome.button_pressed
              data:
                message: up_longpress

  - platform: gpio
    name: "Button Down"
    id: button_down
    pin: 
      number: P23
      mode:
        input: True
        pullup: True
      inverted: True
    filters:
      delayed_on_off: 30ms
    internal: True
    on_multi_click: 
      - timing: 
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for at least ${multiclick_max_length}
        then:
          - if:
              condition:
                or:
                  # If local control is enabled
                  - lambda: return id(relay_local_control_active) == true;
                  # Or if fallback control is enabled and API or WIFI are not connected
                  - and:
                      - lambda: return id(relay_local_control_fallback_active) == true;
                      - or:
                          - not:
                              - api.connected:
                          - not:
                              - wifi.connected:
              then:
                - switch.turn_off: output_relay
          - homeassistant.event:
              event: esphome.button_pressed
              data:
                message: down_singleclick
      - timing:
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for ${multiclick_min_length} to ${multiclick_max_length}
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for at least ${multiclick_max_length}
        then:
          - homeassistant.event:
              event: esphome.button_pressed
              data:
                message: down_doubleclick
      - timing: 
          - ON for at least ${longpress_min_length}
        then:
          - homeassistant.event:
              event: esphome.button_pressed
              data:
                message: down_longpress


sensor:
  - platform: homeassistant
    name: "HA desired indicator brightness value"
    internal: True
    entity_id: ${indicator_brigtness_value_ha_entity_id}
    on_value: 
      then:
        - number.set:
            id: indicator_brightness
            value: !lambda "return x;"
  - platform: internal_temperature
    name: "CPU Temperature"
    id: id_sensor_internal_temperature
    entity_category: diagnostic

switch:
  - platform: gpio
    name: "Relay"
    id: output_relay
    pin:
      number: P7
      inverted: False
    # Rebooting the switch de-energize the relay invariably
    restore_mode: DISABLED # Handled by global variable on boot
    on_turn_on: 
      then:
        - light.turn_off: led_light
    on_turn_off: 
      then:
        - if:
            condition:
              - number.in_range:
                    id: indicator_brightness
                    above: 1.0
            then:
              - light.turn_on: led_light
  # Toggle relay control physically on the switch
  # Useful if you want to use the device as a scene controller
  - platform: template
    name: "Relay local control"
    id: relay_local_control_toggle
    entity_category: config
    disabled_by_default: True
    restore_mode: RESTORE_DEFAULT_ON 
    lambda: "return id(relay_local_control_active) == true;"
    turn_on_action:
      - globals.set: 
          id: relay_local_control_active
          value: "true"
    turn_off_action:
      - globals.set: 
          id: relay_local_control_active
          value: "false"
  # Toggle fallback of local relay control if API or WIFI is disconnected
  - platform: template
    name: "Relay control fallback"
    id: relay_local_control_fallback_toggle
    entity_category: config
    disabled_by_default: True
    restore_mode: RESTORE_DEFAULT_ON 
    lambda: "return id(relay_local_control_fallback_active) == true;"
    turn_on_action:
      - globals.set: 
          id: relay_local_control_fallback_active
          value: "true"
    turn_off_action:
      - globals.set: 
          id: relay_local_control_fallback_active
          value: "false"
  - platform: template
    name: "Relay state on boot"
    id: relay_state_on_boot_toggle
    entity_category: config
    disabled_by_default: True
    restore_mode: DISABLED
    lambda: "return id(relay_on_boot_state) == true;"
    turn_on_action:
      - globals.set: 
          id: relay_on_boot_state
          value: "true"
    turn_off_action:
      - globals.set: 
          id: relay_on_boot_state
          value: "false"

output:
  # White LED
  - platform: libretiny_pwm
    id: led_pwm_output
    pin:
      number: P24
      inverted: True
    frequency: 1000 Hz
    min_power: 0.01
    zero_means_zero: True

light:
  # White LED
  - platform: monochromatic
    id: led_light
    output: led_pwm_output
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    internal: true
        
number:
  # Templated brightness slider to configure white LED's brightness without toggling it ON or OFF
  - platform: template
    name: "Indicator Brightness"
    id: indicator_brightness
    entity_category: config
    min_value: 0
    max_value: 100
    step: 1
    optimistic: True
    # To preserve flash, it's not restored on boot.
    initial_value: ${indicator_brightness_when_offline_percent}
    on_value: 
      then:
        # Change brightness value
        - light.control:
            id: led_light
            brightness: !lambda return x/100;
        # If relay is OFF and brightness value is above 0%, turn ON LED.
        # If not, turn OFF LED.
        - if:
            condition:
              and:
                - switch.is_off: output_relay
                - number.in_range:
                    id: indicator_brightness
                    above: 0.01
            then:
              - light.control:
                  id: led_light
                  state: ON
            else: 
              - light.control:
                  id: led_light
                  state: OFF
