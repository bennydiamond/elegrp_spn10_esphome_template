substitutions:
  log_level: "INFO"
  indicator_brightness_when_offline_percent: '100'
  multiclick_min_length: "40ms" # Should be above 30ms
  multiclick_max_length: "350ms"
  longpress_min_length: "1000ms"
  longpress_reboot_length: "10s"
  # Relay state on boot in case value cannot be restored from flash. 
  # You should set to false if not needed as the device will momentarily de-energize the relay on reboots (hardware limitation)
  # If set to true
  default_relay_on_boot_is_active: "false" 
  api_disconnect_reboot_timeout: "15min"
  wifi_disconnect_reboot_timeout: "15min"

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  project:
    name: elegrp.spn10_template
    version: "1.2mqtt"
  platformio_options:
    build_flags:
      - -DLWIP_DHCP_DOES_ACD_CHECK=0 # fix for https://github.com/libretiny-eu/libretiny/issues/316
  on_boot: 
    then:
      - light.control:
          id: led_light
          brightness: !lambda return id(indicator_brightness).state / 100;
      - if:
          condition:
            lambda: return id(relay_on_boot_state) == true;
          then:
            - delay: 1s
            - switch.turn_on: output_relay
          else:
            - switch.turn_off: output_relay 

bk72xx:
  board: cb2s
  framework: 
    version: 1.8.0

mqtt:
  id: id_mqtt_broker
  broker: 192.168.0.250
  port: 1883
  username: esphome
  password: esphome
  topic_prefix: "esphome/${device_name}"
  discovery_unique_id_generator: mac
  on_disconnect:
    if:
      condition:
        for:
          time: 10min
          condition:
            not:
              mqtt.connected:
      then:
        - number.set:
            id: indicator_brightness
            value: ${indicator_brightness_when_offline_percent}

ota:
  - platform: esphome
    id: id_esphome_ota

captive_portal:
  id: id_captive_portal

web_server:
  id: id_web_server
  include_internal: True
  
mdns:
  id: id_mdns
  disabled: True
  
debug:
  id: id_debug
  update_interval: 30s

# Enable logging
logger:
  id: id_logger
  level: ${log_level}
  baud_rate: 0 # Disable log to uart because its unreachable anyway

globals:
  - id: relay_local_control_active
    type: bool
    restore_value: Yes
    initial_value: "true"
  - id: relay_local_control_fallback_active
    type: bool
    restore_value: Yes
    initial_value: "true"
  - id: relay_on_boot_state
    type: bool
    restore_value: Yes
    initial_value: ${default_relay_on_boot_is_active}

sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic
  - platform: internal_temperature
    name: "CPU Temperature"
    id: id_sensor_internal_temperature
    entity_category: diagnostic
  - platform: uptime
    type: seconds
    name: Uptime
  - platform: debug
    free:
      name: "Heap Free"
    loop_time:
      name: "Loop Time"
  - platform: mqtt_subscribe
    name: "HA desired indicator brightness value"
    topic: ${indicator_brightness_topic}
    on_value: 
      then:
        - number.set:
            id: indicator_brightness
            value: !lambda "return x;"

button:
  - platform: restart
    id: id_device_restart
    name: "Device Restart"
  - platform: safe_mode
    id: id_device_restart_safe_mode
    name: "Device Restart (Safe Mode)"

binary_sensor:
  - platform: gpio
    name: "Button Up"
    id: button_up
    pin: 
      number: P6
      mode:
        input: True
        pullup: True
      inverted: True
    filters:
      delayed_on_off: 30ms
    internal: True
    on_multi_click: 
      - timing: 
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for at least ${multiclick_max_length}
        then:
          - if:
              condition:
                or:
                  # If local control is enabled
                  - lambda: return id(relay_local_control_active) == true;
                  # Or if fallback control is enabled and MQTT or WIFI are not connected
                  - and:
                      - lambda: return id(relay_local_control_fallback_active) == true;
                      - or:
                          - not:
                              - mqtt.connected:
                          - not:
                              - wifi.connected:
              then:
                - switch.turn_on: output_relay
          - mqtt.publish:
              topic: esphome/${device_name}/button_pressed
              payload: "up_singleclick"
      - timing:
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for ${multiclick_min_length} to ${multiclick_max_length}
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for at least ${multiclick_max_length}
        then:
          - mqtt.publish:
              topic: esphome/${device_name}/button_pressed
              payload: "up_doubleclick"
      - timing: 
          - ON for at least ${longpress_min_length}
        then:
          - mqtt.publish:
              topic: esphome/${device_name}/button_pressed
              payload: "up_longpress"
      - timing: 
          - ON for at least ${longpress_reboot_length}
        then:
          - button.press:
              id: id_device_restart_safe_mode

  - platform: gpio
    name: "Button Down"
    id: button_down
    pin: 
      number: P23
      mode:
        input: True
        pullup: True
      inverted: True
    filters:
      delayed_on_off: 30ms
    internal: True
    on_multi_click: 
      - timing: 
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for at least ${multiclick_max_length}
        then:
          - if:
              condition:
                or:
                  # If local control is enabled
                  - lambda: return id(relay_local_control_active) == true;
                  # Or if fallback control is enabled and API or WIFI are not connected
                  - and:
                      - lambda: return id(relay_local_control_fallback_active) == true;
                      - or:
                          - not:
                              - mqtt.connected:
                          - not:
                              - wifi.connected:
              then:
                - switch.turn_off: output_relay
          - mqtt.publish:
              topic: esphome/${device_name}/button_pressed
              payload: "down_singleclick"
      - timing:
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for ${multiclick_min_length} to ${multiclick_max_length}
          - ON for ${multiclick_min_length} to ${multiclick_max_length}
          - OFF for at least ${multiclick_max_length}
        then:
          - mqtt.publish:
              topic: esphome/${device_name}/button_pressed
              payload: "down_doubleclick"
      - timing: 
          - ON for at least ${longpress_min_length}
        then:
          - mqtt.publish:
              topic: esphome/${device_name}/button_pressed
              payload: "down_longpress"
      - timing: 
          - ON for at least ${longpress_reboot_length}
        then:
          - button.press:
              id: id_device_restart

switch:
  - platform: gpio
    name: "Relay"
    id: output_relay
    pin:
      number: P7
      inverted: False
    # Rebooting the switch de-energize the relay invariably
    restore_mode: DISABLED # Handled by global variable on boot
    on_turn_on: 
      then:
        - light.turn_off: led_light
    on_turn_off: 
      then:
        - if:
            condition:
              - number.in_range:
                    id: indicator_brightness
                    above: 1.0
            then:
              - light.turn_on: led_light
  # Toggle relay control physically on the switch
  # Useful if you want to use the device as a scene controller
  - platform: template
    name: "Relay local control"
    id: relay_local_control_toggle
    entity_category: config
    disabled_by_default: True
    restore_mode: RESTORE_DEFAULT_ON 
    lambda: "return id(relay_local_control_active) == true;"
    turn_on_action:
      - globals.set: 
          id: relay_local_control_active
          value: "true"
    turn_off_action:
      - globals.set: 
          id: relay_local_control_active
          value: "false"
  # Toggle fallback of local relay control if API or WIFI is disconnected
  - platform: template
    name: "Relay control fallback"
    id: relay_local_control_fallback_toggle
    entity_category: config
    disabled_by_default: True
    restore_mode: RESTORE_DEFAULT_ON 
    lambda: "return id(relay_local_control_fallback_active) == true;"
    turn_on_action:
      - globals.set: 
          id: relay_local_control_fallback_active
          value: "true"
    turn_off_action:
      - globals.set: 
          id: relay_local_control_fallback_active
          value: "false"
  - platform: template
    name: "Relay state on boot"
    id: relay_state_on_boot_toggle
    entity_category: config
    disabled_by_default: True
    restore_mode: DISABLED
    lambda: "return id(relay_on_boot_state) == true;"
    turn_on_action:
      - globals.set: 
          id: relay_on_boot_state
          value: "true"
    turn_off_action:
      - globals.set: 
          id: relay_on_boot_state
          value: "false"

output:
  # White LED
  - platform: libretiny_pwm
    id: led_pwm_output
    pin:
      number: P24
      inverted: True
    frequency: 1000 Hz
    min_power: 0.01
    zero_means_zero: True

light:
  # White LED
  - platform: monochromatic
    id: led_light
    output: led_pwm_output
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    internal: true
        
number:
  # Templated brightness slider to configure white LED's brightness without toggling it ON or OFF
  - platform: template
    name: "Indicator Brightness"
    id: indicator_brightness
    entity_category: config
    min_value: 0
    max_value: 100
    step: 1
    optimistic: True
    # To preserve flash, it's not restored on boot.
    initial_value: ${indicator_brightness_when_offline_percent}
    on_value: 
      then:
        # Change brightness value
        - light.control:
            id: led_light
            brightness: !lambda return x/100;
        # If relay is OFF and brightness value is above 0%, turn ON LED.
        # If not, turn OFF LED.
        - if:
            condition:
              and:
                - switch.is_off: output_relay
                - number.in_range:
                    id: indicator_brightness
                    above: 0.01
            then:
              - light.control:
                  id: led_light
                  state: ON
            else: 
              - light.control:
                  id: led_light
                  state: OFF
